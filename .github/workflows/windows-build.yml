# 윈도우 설치 파일을 깃허브가 대신 만든다.
#
# 쓰는 법 두 가지
#   1) 저장소 Actions 탭 → "윈도우 설치 파일" → Run workflow 를 누른다.
#      끝나면 그 실행 페이지 아래 Artifacts 에서 설치 파일을 내려받는다.
#   2) 돌릴 때마다 Releases 에도 올라간다. 거기서는 exe 를 바로 내려받을 수 있다.
#
# 내 PC에 파이썬·Inno Setup이 없어도 되고, 빌드하는 걸 잊어 옛 버전을 쓰는 일도 없다.

name: 윈도우 설치 파일

on:
  workflow_dispatch:      # 손으로 눌러서 만들기
  push:
    tags: ["v*"]          # 태그를 밀면 Release 까지

permissions:
  contents: write         # Release 에 파일을 올리려면 필요하다

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup 준비
        shell: pwsh
        run: |
          # windows-latest 이미지에 보통 들어 있다. 없을 때만 설치한다.
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: 빌드
        shell: pwsh
        run: .\packaging\build.ps1 -Installer

      # 빌드가 됐다고 켜지는 게 아니다. v1.1.0 첫 빌드는 만들어졌지만
      # certifi 문제로 시작조차 못 했다. 실제로 띄워서 응답하는지 본다.
      - name: 켜지는지 확인
        shell: pwsh
        run: |
          $exe = "dist\YoutubeClipper\YoutubeClipper.exe"
          if (-not (Test-Path $exe)) { throw "실행 파일이 없습니다: $exe" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-open","--port","8765" -PassThru
          $health = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try {
              $res = Invoke-WebRequest "http://127.0.0.1:8765/api/health" -UseBasicParsing -TimeoutSec 3
              if ($res.StatusCode -eq 200) { $health = $res.Content; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $health) {
            Write-Host "== app.log =="
            Get-Content "$env:LOCALAPPDATA\YoutubeClipper\app.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "빌드는 됐지만 앱이 시작되지 않았습니다"
          }
          Write-Host "앱이 응답했습니다:"
          Write-Host $health

      # 번들한 ffmpeg 에 GPU 인코더가 들어 있는지 기록해 둔다.
      # "GPU를 못 쓴다"는 이야기가 나왔을 때 빌드 문제인지 사용자 PC 문제인지 갈린다.
      - name: 번들 ffmpeg 의 하드웨어 인코더
        shell: pwsh
        run: |
          $ff = "dist\YoutubeClipper\bin\ffmpeg.exe"
          if (-not (Test-Path $ff)) { Write-Host "번들 ffmpeg 없음: $ff"; exit 0 }
          & $ff -hide_banner -version | Select-Object -First 1
          $found = & $ff -hide_banner -encoders |
                   Select-String -Pattern "nvenc|_qsv|_amf|videotoolbox"
          if ($found) { $found | ForEach-Object { Write-Host $_ } }
          else { Write-Host "하드웨어 인코더가 하나도 없습니다" }

      - name: 버전 읽기
        id: ver
        shell: pwsh
        run: |
          $v = (& python .\packaging\stamp.py --print-version).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: YoutubeClipper-${{ steps.ver.outputs.version }}-setup
          path: dist/installer/YoutubeClipper-setup.exe
          if-no-files-found: error

      # Artifacts 는 zip으로 감싸이고 로그인해야 받을 수 있다. Release 로 올려두면
      # 누구나 exe 를 바로 내려받는다. 같은 버전을 다시 돌리면 그 Release 를 갱신한다.
      - name: Release 로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: dist/installer/YoutubeClipper-setup.exe
          body: |
            윈도우 설치 파일입니다. 받아서 실행하면 됩니다.

            설치 뒤 앱의 `관리`에서 버전이 **${{ steps.ver.outputs.version }}** 인지 확인하세요.

            빌드한 커밋: ${{ github.sha }}
